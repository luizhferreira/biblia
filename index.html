<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://liturgia.up.railway.app https://api.getbible.net; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

         (itálico, latin-ext, blackletter) ficam a cargo do @font-face. -->

    <link rel="preload" as="font" type="font/woff2" href="./fonts/cinzel-latin.woff2" crossorigin />

    <!-- O texto do capítulo padrão só começaria a ser buscado depois que o
         bundle carrega e executa; o preload antecipa isso para o início da
         navegação. Ver docs/superpowers/specs/2026-07-28-lighthouse-performance-design.md -->
    <link rel="preload" as="fetch" href="./data/pt/jo.json" crossorigin />

    <!-- Vulgata e King James vêm desta origem durante a carga do capítulo. -->
    <link rel="preconnect" href="https://api.getbible.net" crossorigin />

    <title>Codex Sacræ · Vulgata Latina & Matos Soares</title>

    <div id="root"></div>
